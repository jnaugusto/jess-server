# Redirect HTTP to HTTPS for main domain (Commented out for local / before certs)
server {
    listen 80;
    server_name jnaugusto.com www.jnaugusto.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

# API subdomain HTTPS (Served on HTTP port 80 for local / pre-cert setup)
server {
    listen 80;
    server_name api.jnaugusto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        proxy_pass http://app:3005/health;
        access_log off;
    }
}

# PowerSync subdomain HTTP (Redirect to HTTPS)
server {
    listen 80;
    server_name powersync.jnaugusto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# Main domain HTTPS — serves jess-web static files
server {
    listen 443 ssl;
    server_name jnaugusto.com www.jnaugusto.com;

    ssl_certificate /etc/letsencrypt/live/jnaugusto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jnaugusto.com/privkey.pem;

    root /var/www/jess-web;
    index index.html;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|svg|ico|woff|woff2|ttf)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # SPA routing — all routes fall back to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}

