# PowerSync subdomain HTTP (Redirect to HTTPS)
server {
    listen 80;
    server_name powersync.jnaugusto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# PowerSync subdomain HTTPS
server {
    listen 443 ssl;
    server_name powersync.jnaugusto.com;

    ssl_certificate /etc/letsencrypt/live/jnaugusto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jnaugusto.com/privkey.pem;

    location / {
        proxy_pass http://powersync:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 300s; # PowerSync can have long-lived connections

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }
}
