# Redirect HTTP to HTTPS for main domain (Commented out for local / before certs)
server {
    listen 80;
    server_name jnaugusto.com www.jnaugusto.com localhost;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Serve the app directly on port 80 for now (local / pre-cert setup)
    location / {
        return 200 'jnaugusto.com is live!';
        add_header Content-Type text/plain;
    }
}

# API subdomain HTTPS (Served on HTTP port 80 for local / pre-cert setup)
server {
    listen 80;
    server_name api.jnaugusto.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        proxy_pass http://app:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        proxy_buffer_size 128k;
        proxy_buffers 4 256k;
        proxy_busy_buffers_size 256k;
    }

    location /health {
        proxy_pass http://app:3005/health;
        access_log off;
    }
}

# Main domain HTTPS
server {
    listen 443 ssl;
    server_name jnaugusto.com www.jnaugusto.com;

    ssl_certificate /etc/letsencrypt/live/jnaugusto.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/jnaugusto.com/privkey.pem;

    location / {
        # Point this to your frontend or a coming soon page
        return 200 'jnaugusto.com is live!';
        add_header Content-Type text/plain;
    }
}

