# PowerSync Service Configuration
# https://docs.powersync.com/self-hosting

replication:
  connections:
    - type: postgresql
      uri: postgresql://jnaugusto:a@_Test1234@db:5432/jess_db
      # SSL settings
      sslmode: disable

# Connection settings for bucket storage (using Postgres instead of MongoDB)
storage:
  type: postgresql
  uri: postgresql://jnaugusto:a@_Test1234@db:5432/powersync_storage
  sslmode: disable

# The port which the PowerSync API server will listen on
port: 8080

# Specify sync rules
sync_rules:
  content: |
    bucket_definitions:
      user_data:
        # Separate bucket for each user to ensure isolation
        parameters: SELECT request.user_id() as user_id
        data:
          - SELECT * FROM tracks WHERE user_id = bucket.user_id
          - SELECT * FROM location_points WHERE user_id = bucket.user_id

