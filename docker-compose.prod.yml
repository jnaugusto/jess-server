services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: jnaugusto
      POSTGRES_PASSWORD: jnaugusto1027
      POSTGRES_DB: jess_db
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-powersync-db.sh:/docker-entrypoint-initdb.d/00-init-powersync-db.sh
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    # Enable logical replication for PowerSync WAL tracking + md5 for pgwire compatibility
    command: ["postgres", "-c", "wal_level=logical", "-c", "password_encryption=md5"]
    healthcheck:
      # Simplified healthcheck - pg_isready doesn't actually need a database name to check readiness
      test: ["CMD-SHELL", "pg_isready -U jnaugusto"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s # Ignore failures for first 40s during init scripts

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # PowerSync self-hosted service
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      - db
    command: ["start", "-r", "unified"]
    volumes:
      - ./config/powersync.yaml:/config/config.yaml
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    ports:
      - "8080:8080"

  app:
    build: .
    working_dir: /app
    ports:
      - "3005:3005"
    environment:
      - CI=true
      - NODE_ENV=${NODE_ENV}
      - NODE_OPTIONS=--experimental-require-module
      - DATABASE_URL=${DATABASE_URL}
      - REDIS_HOST=${REDIS_HOST}
      - REDIS_PORT=${REDIS_PORT}
      - PORT=${PORT}
      - POWERSYNC_URL=${POWERSYNC_URL}
      - POWERSYNC_JWT_PRIVATE_KEY=${POWERSYNC_JWT_PRIVATE_KEY}
      - BETTER_AUTH_SECRET=${BETTER_AUTH_SECRET}
      - BETTER_AUTH_URL=${BETTER_AUTH_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      powersync:
        condition: service_started

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - app
      - powersync

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  postgres_data:
  certbot-www:
  certbot-certs:
