version: '3.8'
services:
  db:
    image: postgres:17-alpine
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: jess_db
      POSTGRES_HOST_AUTH_METHOD: md5
      POSTGRES_INITDB_ARGS: "--auth-host=md5"
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-powersync-db.sh:/docker-entrypoint-initdb.d/00-init-powersync-db.sh
      - ./init.sql:/docker-entrypoint-initdb.d/01-init.sql
    # Enable logical replication for PowerSync WAL tracking + md5 for pgwire compatibility
    command: ["postgres", "-c", "wal_level=logical", "-c", "password_encryption=md5"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d jess_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"

  # PowerSync self-hosted service
  powersync:
    image: journeyapps/powersync-service:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command: ["start", "-r", "unified"]
    volumes:
      - ./config/powersync.yaml:/config/config.yaml
    environment:
      POWERSYNC_CONFIG_PATH: /config/config.yaml
    ports:
      - "8080:8080"

  app:
    build: .
    working_dir: /app
    volumes:
      - .:/app
      - /app/node_modules # Preserve node_modules inside container
    ports:
      - "3005:3005"
    environment:
      - CI=true
      - NODE_ENV=development
      - NODE_OPTIONS=--experimental-require-module
      - DATABASE_URL=postgresql://postgres:postgrespassword@db:5432/jess_db
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - PORT=3005
      - POWERSYNC_URL=http://powersync:8080
    depends_on:
      - db
      - redis
      - powersync
    command: sh -c "npm install -g pnpm@latest && pnpm install --frozen-lockfile && pnpm run start:dev"

  nginx:
    image: nginx:alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf:/etc/nginx/conf.d/default.conf
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
    depends_on:
      - app

  certbot:
    image: certbot/certbot
    volumes:
      - certbot-www:/var/www/certbot
      - certbot-certs:/etc/letsencrypt

volumes:
  postgres_data:
  certbot-www:
  certbot-certs:
