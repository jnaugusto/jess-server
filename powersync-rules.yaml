bucket_definitions:
  # Tracks and location points for the driver's own trips.
  user_data:
    parameters: SELECT request.user_id() as user_id
    data:
      - SELECT * FROM tracks WHERE user_id = bucket.user_id
      - SELECT * FROM location_points WHERE user_id = bucket.user_id

  # Fleet memberships — sync every driver record that belongs to this user,
  # plus all non-decommissioned vehicles and the owner's org name.
  # This powers the offline fleet selector in the app.
  driver_fleet:
    parameters: >
      SELECT id AS driver_id, owner_user_id
      FROM drivers
      WHERE driver_user_id = request.user_id()
        AND status = 'active'
    data:
      - SELECT * FROM drivers WHERE id = bucket.driver_id
      - SELECT * FROM vehicles
        WHERE owner_user_id = bucket.owner_user_id
          AND status != 'decommissioned'
      - SELECT user_id, org_name FROM user_settings
        WHERE user_id = bucket.owner_user_id
